name: Record real Mac wallpaper motion
on:
  push:
    branches: [main]
    paths: ['Tests/promo-capture.swift', 'Tests/run-promo.sh', '.github/workflows/promo-capture.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash build.sh
      - run: bash Tests/run-promo.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Meadow-Real-Motion
          path: promo-capture/*.mp4
          retention-days: 7
          if-no-files-found: error
