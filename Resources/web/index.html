<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meadow Collection — Live Wallpapers</title>
<link rel="stylesheet" href="style.css?v=56">
</head>
<body>
<canvas id="c"></canvas>
<div id="scenes" role="tablist"></div>
<div id="modes" role="tablist">
  <button data-mode="auto" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Auto</button>
  <button data-mode="day"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>Day</button>
  <button data-mode="golden"><svg viewBox="0 0 24 24"><path d="M3 18h18M6 18a6 6 0 0 1 12 0M12 6v3M4.5 10.5l2 2M19.5 10.5l-2 2"/></svg>Golden</button>
  <button data-mode="night"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>Night</button>
</div>
<script>
function showErr(m){var d=document.getElementById('err');if(!d){d=document.createElement('pre');d.id='err';d.style.cssText='position:fixed;left:8px;top:84px;right:8px;max-height:55vh;overflow:auto;margin:0;padding:10px;background:rgba(120,0,0,.88);color:#fff;font:12px/1.4 monospace;z-index:99;white-space:pre-wrap;border-radius:8px;pointer-events:none';document.body.appendChild(d)}d.textContent+=m+'\n';clearTimeout(d._t);d._t=setTimeout(function(){d.remove()},20000)}
window.showErr=showErr;
addEventListener('error',function(e){showErr('JS error: '+e.message+' ('+String(e.filename||'').split('/').pop()+':'+e.lineno+')')});
addEventListener('unhandledrejection',function(e){showErr('Promise: '+(e.reason&&e.reason.message||e.reason))});
</script>
<script src="mac-bridge.js"></script>
<script src="bundle.js?v=56"></script>
</body>
</html>
